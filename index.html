<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>小肥閱讀紀錄</title>
<style>
:root{--bg:#f6f0e6;--ink:#2c241c;--muted:#7a6a58;--card:#fffaf3;--line:#e5d8c6;--accent:#c45c26;--accent-soft:#f0d3c0;--shadow:0 12px 30px rgba(74,48,24,.12);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#fff8ee 0%,transparent 55%),var(--bg);min-height:100vh;line-height:1.5}
.page{max-width:1100px;margin:0 auto;padding:48px 24px 80px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800}.sub{margin:0;color:var(--muted)}
.stats{display:flex;gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:center;box-shadow:var(--shadow)}.stat .n{display:block;font-size:1.6rem;font-weight:800;color:var(--accent)}.stat .l{font-size:.78rem;color:var(--muted)}
.chart-fold{margin-bottom:36px}
.chart-fold>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:700;font-size:.92rem;color:var(--accent);box-shadow:var(--shadow);user-select:none}
.chart-fold>summary::-webkit-details-marker{display:none}
.chart-fold>summary::before{content:"▸";font-size:.85rem}
.chart-fold[open]>summary::before{content:"▾"}
.chart-fold>summary:hover{background:var(--accent-soft)}
.chart-card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px 8px;overflow:auto}
.chart-card h2{margin:0 0 6px;font-size:1.1rem}.chart-note{margin:0 0 12px;color:var(--muted);font-size:.82rem}
.chart-card img{display:block;width:min(100%,840px);height:auto;margin:0 auto}
.day{margin-bottom:42px}.day-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}.day-head time{font-size:1.25rem;font-weight:700}.weekday{color:var(--muted)}.count{margin-left:auto;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.book{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s}
.book:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(74,48,24,.16)}
.cover-wrap{background:linear-gradient(180deg,#f3ebe0,#e8dccb);padding:18px 18px 8px;display:flex;justify-content:center;align-items:flex-end;min-height:240px}
.cover{width:min(160px,100%);border-radius:4px 8px 8px 4px;box-shadow:4px 8px 18px rgba(40,24,10,.25);display:block}
.meta{padding:14px 16px 18px}.title{margin:0 0 6px;font-size:1.02rem;font-weight:700}.author{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.tag{background:var(--accent-soft);color:var(--accent);font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px}
.hint{margin:0;color:var(--accent);font-size:.78rem;font-weight:600}
footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;text-align:center}
.dialog-backdrop{position:fixed;inset:0;background:rgba(44,36,28,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.dialog-backdrop.open{display:flex}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(40,24,10,.28);max-width:420px;width:100%;max-height:min(90vh,720px);overflow:auto;position:relative}
.dialog-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:none;border-radius:999px;background:rgba(255,255,255,.85);font-size:1.2rem;cursor:pointer}
.dialog .cover-wrap{min-height:260px;padding-top:28px}.dialog .cover{width:min(180px,70%)}.dialog .meta{padding:8px 22px 28px}
.lesson-label{margin:14px 0 6px;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}.lesson{margin:0;font-size:1.02rem;line-height:1.65}.award-label{margin:16px 0 6px;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}.award{margin:0;font-size:.92rem;line-height:1.55;color:var(--ink)}
.values-label{margin:14px 0 6px;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
</style>
</head>
<body>
<div class="page">
<header class="hero"><div><h1>小肥閱讀紀錄</h1><p class="sub">台灣雲端書庫 · 親子共讀 · 點書看啟發與價值觀</p></div>
<div class="stats"><div class="stat"><span class="n" id="bookCount">8</span><span class="l">本書</span></div><div class="stat"><span class="n" id="dayCount">4</span><span class="l">天</span></div><div class="stat"><span class="n" id="valueHit">—</span><span class="l">已涵蓋價值</span></div></div></header>
<details class="chart-fold">
<summary>看價值觀涵蓋圖</summary>
<section class="chart-card"><h2>價值觀涵蓋</h2><p class="chart-note">15 個小朋友價值觀；一本書可對應多個。長條＝已讀本數。</p><img src="values-chart.svg" alt="價值觀涵蓋長條圖" loading="lazy"/></section>
</details>
<div id="days"></div>
<footer>封面取自台灣雲端書庫 · 更新於 2026-09-24</footer>
</div>
<div class="dialog-backdrop" id="bookDialog" role="dialog" aria-modal="true" hidden>
<div class="dialog"><button type="button" class="dialog-close" id="dlgClose" aria-label="關閉">×</button>
<div class="cover-wrap"><img class="cover" id="dlgCover" src="" alt=""/></div>
<div class="meta"><h3 class="title" id="dlgTitle"></h3><p class="author" id="dlgAuthor"></p>
<p class="values-label">價值觀</p><div class="tags" id="dlgTags"></div>
<p class="lesson-label">給孩子的啟發</p><p class="lesson" id="dlgLesson"></p><p class="award-label">得獎／肯定</p><p class="award" id="dlgAward"></p></div></div></div>
<script>
const ALL_VALUES=["勇氣","做自己／接納差異","好奇心","分享與規則","責任感","相處與合作","善意／同理","誠實","感恩","堅持","珍惜自然與生命","情緒可以說","耐心","道歉與和解","照顧弱小"];
fetch('books.json').then(r=>r.json()).then(books=>{
  const by={}; books.forEach(b=>{(by[b.date]=by[b.date]||{weekday:b.weekday,items:[]}).items.push(b)});
  document.getElementById('bookCount').textContent=books.length;
  document.getElementById('dayCount').textContent=Object.keys(by).length;
  const hit=new Set(); books.forEach(b=>(b.values||[]).forEach(v=>hit.add(v)));
  document.getElementById('valueHit').textContent=hit.size+"／"+ALL_VALUES.length;
  const root=document.getElementById('days');
  Object.keys(by).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const g=by[date];
    const sec=document.createElement('section'); sec.className='day';
    sec.innerHTML=`<header class="day-head"><time datetime="${date}">${date}</time><span class="weekday">${g.weekday}</span><span class="count">${g.items.length} 本</span></header><div class="shelf"></div>`;
    const shelf=sec.querySelector('.shelf');
    g.items.forEach(b=>{
      const el=document.createElement('article');
      el.className='book'; el.tabIndex=0; el.setAttribute('role','button');
      el.dataset.title=b.title; el.dataset.author=b.author; el.dataset.cover=b.cover; el.dataset.lesson=b.lesson; el.dataset.award=b.award||'';
      el.dataset.values=JSON.stringify(b.values||[]);
      const tags=(b.values||[]).map(v=>`<span class="tag">${v}</span>`).join('');
      el.innerHTML=`<div class="cover-wrap"><img class="cover" src="${b.cover}" alt="${b.title}" loading="lazy"/></div><div class="meta"><h3 class="title">${b.title}</h3><p class="author">${b.author}</p><div class="tags">${tags}</div><p class="hint">點擊看啟發</p></div>`;
      shelf.appendChild(el);
    });
    root.appendChild(sec);
  });
  const backdrop=document.getElementById('bookDialog');
  const dlgCover=document.getElementById('dlgCover'), dlgTitle=document.getElementById('dlgTitle');
  const dlgAuthor=document.getElementById('dlgAuthor'), dlgLesson=document.getElementById('dlgLesson'), dlgAward=document.getElementById('dlgAward'), dlgTags=document.getElementById('dlgTags');
  function openBook(el){
    dlgCover.src=el.dataset.cover;dlgCover.alt=el.dataset.title;dlgTitle.textContent=el.dataset.title;dlgAuthor.textContent=el.dataset.author;dlgLesson.textContent=el.dataset.lesson;dlgAward.textContent=el.dataset.award||'暫無公開得獎紀錄';
    let vals=[]; try{vals=JSON.parse(el.dataset.values||'[]')}catch(e){}
    dlgTags.innerHTML=vals.length?vals.map(v=>`<span class="tag">${v}</span>`).join(''):'<span class="tag">尚未標註</span>';
    backdrop.hidden=false;backdrop.classList.add('open');
  }
  function closeBook(){backdrop.classList.remove('open');backdrop.hidden=true}
  document.querySelectorAll('.book').forEach(el=>{el.addEventListener('click',()=>openBook(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook(el)}})});
  document.getElementById('dlgClose').onclick=closeBook;
  backdrop.onclick=e=>{if(e.target===backdrop)closeBook()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBook()});
});
</script>
</body></html>
