<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小肥閱讀紀錄</title>
<style>
  :root {
    --bg: #f6f0e6;
    --bg2: #efe6d8;
    --ink: #2c241c;
    --muted: #7a6a58;
    --card: #fffaf3;
    --line: #e5d8c6;
    --accent: #c45c26;
    --accent-soft: #f0d3c0;
    --shadow: 0 12px 30px rgba(74, 48, 24, 0.12);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
      "Source Han Sans TC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #fff8ee 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #f3e0cf 0%, transparent 50%),
      var(--bg);
    min-height: 100vh;
    line-height: 1.5;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .hero {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 40px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .hero h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .hero .sub {
    margin: 0;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .stats {
    display: flex;
    gap: 12px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 18px;
    min-width: 88px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat .n {
    display: block;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat .l {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .day {
    margin-bottom: 42px;
  }
  .day-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }
  .day-head time {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .weekday {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .count {
    margin-left: auto;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 22px;
  }
  .book {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .book:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 36px rgba(74, 48, 24, 0.16);
  }
  .cover-wrap {
    background:
      linear-gradient(180deg, #f3ebe0 0%, #e8dccb 100%);
    padding: 18px 18px 8px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    min-height: 240px;
  }
  .cover {
    width: min(160px, 100%);
    height: auto;
    border-radius: 4px 8px 8px 4px;
    box-shadow:
      4px 8px 18px rgba(40, 24, 10, 0.25),
      inset -2px 0 0 rgba(255,255,255,0.25);
    display: block;
  }
  .meta {
    padding: 14px 16px 18px;
  }
  .title {
    margin: 0 0 6px;
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.35;
  }
  .author {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 0.86rem;
  }
  footer {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }
  @media (max-width: 560px) {
    .page { padding: 28px 16px 60px; }
    .cover-wrap { min-height: 210px; }
  }
  @media print {
    body { background: white; }
    .book { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1>小肥閱讀紀錄</h1>
        <p class="sub">台灣雲端書庫 · 親子共讀</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="n">7</span><span class="l">本書</span></div>
        <div class="stat"><span class="n">3</span><span class="l">天</span></div>
      </div>
    </header>
    
    <section class="day">
      <header class="day-head">
        <time datetime="2026-09-22">2026-09-22</time>
        <span class="weekday">星期二</span>
        <span class="count">1 本</span>
      </header>
      <div class="shelf">
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/01-de93cd66.svg" alt="鱷魚愛上長頸鹿 2：搬過來搬過去" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">鱷魚愛上長頸鹿 2：搬過來搬過去</h3>
          <p class="author">達妮拉·庫洛特</p>
        </div>
      </article>
      </div>
    </section>
    <section class="day">
      <header class="day-head">
        <time datetime="2026-09-23">2026-09-23</time>
        <span class="weekday">星期三</span>
        <span class="count">3 本</span>
      </header>
      <div class="shelf">
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/02-bc7ab4ad.svg" alt="你會咚咚咚嗎？" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">你會咚咚咚嗎？</h3>
          <p class="author">張韻珊</p>
        </div>
      </article>
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/03-7ef2bf02.svg" alt="排隊領免費的鬆餅" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">排隊領免費的鬆餅</h3>
          <p class="author">瑪莉亞·肯尼薩萊斯等</p>
        </div>
      </article>
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/04-9baba37e.svg" alt="小小鏟雪車，出動！" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">小小鏟雪車，出動！</h3>
          <p class="author">中野真典</p>
        </div>
      </article>
      </div>
    </section>
    <section class="day">
      <header class="day-head">
        <time datetime="2026-09-24">2026-09-24</time>
        <span class="weekday">星期四</span>
        <span class="count">3 本</span>
      </header>
      <div class="shelf">
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/05-e8cdb07a.svg" alt="我不怕黑" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">我不怕黑</h3>
          <p class="author">達妮拉·庫洛特</p>
        </div>
      </article>
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/06-6a08d8d1.svg" alt="想要不一樣（創作20週年紀念版）" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">想要不一樣（創作20週年紀念版）</h3>
          <p class="author">童嘉</p>
        </div>
      </article>
      <article class="book">
        <div class="cover-wrap">
          <img class="cover" src="covers/07-39eed2bb.svg" alt="沒毛雞（陳致元作品集1）" loading="lazy" />
        </div>
        <div class="meta">
          <h3 class="title">沒毛雞（陳致元作品集1）</h3>
          <p class="author">陳致元</p>
        </div>
      </article>
      </div>
    </section>
    <footer>封面取自台灣雲端書庫 · 更新於 2026-09-24</footer>
  </div>
</body>
</html>
